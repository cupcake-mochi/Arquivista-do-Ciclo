name: Testes do Arquivista
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  logica:
    runs-on: ubuntu-latest
    env:
      # test_layout.py grava os pedidos de um cenário e test_planilha.js confere que o script os aceita.
      PLANILHA_CENARIO: /tmp/cenario-planilha.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_bridge.js
      - run: node --check < apps_script/Arquivista.gs
      - run: node --check < apps_script/Aparencias.gs
      - run: node tests/test_planilha.js
      - run: node --check < apps_script/Planilha.gs
